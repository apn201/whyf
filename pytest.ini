[pytest]
testpaths = tests

# build/ and infra/cdk.out/ both contain a copy of the Lambda bundle, which
# holds Linux wheels for pydantic_core. Left on the path they shadow the real
# ones and every import fails with a message that points nowhere near the
# cause.
norecursedirs = build infra/cdk.out private .git *.egg-info __pycache__

filterwarnings =
    ignore::DeprecationWarning
