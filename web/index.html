<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="description" content="Paste one row from a security questionnaire. Get one verdict.">
<title>WHY? &mdash; why the f are they asking this</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#101014">
<style>
:root{
  --bg:#101014; --card:#17171d; --edge:#26262f; --ink:#e9e9ee; --dim:#8b8b98;
  --hot:#ff5a4d; --warm:#ffb02e; --cool:#4ec9a4; --flat:#5f6b7a;
  --pad:18px; --r:14px;
}
@media (prefers-color-scheme:light){
  :root{--bg:#f4f4f6;--card:#fff;--edge:#e3e3e8;--ink:#16161a;--dim:#6a6a76}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding:0 var(--pad) 64px;
  max-width:520px;margin-inline:auto;
}
header{padding:26px 0 14px}
h1{font-size:34px;letter-spacing:-.03em;margin:0;font-weight:800}
h1 span{color:var(--hot)}
.tag{color:var(--dim);font-size:14px;margin:4px 0 0}
.rule{color:var(--dim);font-size:12.5px;margin:12px 0 0;line-height:1.45}

textarea{
  width:100%;min-height:96px;resize:vertical;padding:13px 14px;margin-top:16px;
  background:var(--card);color:var(--ink);border:1px solid var(--edge);
  border-radius:var(--r);font:inherit;font-size:15px;
}
textarea:focus{outline:2px solid var(--hot);outline-offset:-1px}
.row{display:flex;gap:8px;margin-top:10px}
button{
  font:inherit;font-weight:600;border-radius:11px;border:1px solid var(--edge);
  background:var(--card);color:var(--ink);padding:11px 14px;cursor:pointer;
}
button:active{transform:translateY(1px)}
button.go{background:var(--hot);border-color:var(--hot);color:#fff;flex:1}
button:disabled{opacity:.5;cursor:default}
.examples{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.examples button{font-size:12.5px;font-weight:500;padding:7px 10px;color:var(--dim)}

.card{
  background:var(--card);border:1px solid var(--edge);border-radius:var(--r);
  padding:16px;margin-top:14px;
}
.verdict{border-left:4px solid var(--flat)}
.v-not-applicable,.v-already-solved{border-left-color:var(--cool)}
.v-write-it-down,.v-cheap-checkbox{border-left-color:var(--warm)}
.v-do-it-properly{border-left-color:var(--hot)}
.v-cannot-tell-yet{border-left-color:var(--flat)}
.headline{font-size:23px;font-weight:800;letter-spacing:-.02em;margin:0}
.sub{color:var(--dim);margin:5px 0 0;font-size:14.5px}
.concept{color:var(--dim);font-size:12px;margin-top:12px;letter-spacing:.04em;text-transform:uppercase}
.lede{margin:12px 0 0;font-size:15.5px}

.bars{display:grid;grid-template-columns:auto 1fr auto;gap:7px 10px;align-items:center;margin-top:16px;font-size:13px}
.bars b{font-weight:600;color:var(--dim)}
.meter{height:7px;background:var(--edge);border-radius:4px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:4px}
.gap{grid-column:1/-1;color:var(--dim);font-size:12.5px;margin-top:2px}

.ask{border:1px dashed var(--hot);background:transparent}
.ask p{margin:0 0 11px;font-weight:600}
.opts{display:flex;flex-direction:column;gap:7px}
.opts button{text-align:left;font-weight:500;font-size:14.5px}
.opts button:hover{border-color:var(--hot)}

details{border-top:1px solid var(--edge);padding:11px 0 0;margin-top:11px}
details:first-of-type{border-top:0;margin-top:0}
summary{cursor:pointer;font-weight:600;font-size:14.5px;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"+ ";color:var(--hot);font-weight:800}
details[open] summary::before{content:"\2212 "}
details p,details div{margin:9px 0 2px;font-size:14.5px;color:var(--ink)}
.cost{display:grid;grid-template-columns:1fr auto;gap:5px 12px;font-size:14px}
.cost span:nth-child(even){color:var(--warm);letter-spacing:2px;white-space:nowrap}
.note{background:rgba(255,90,77,.09);border:1px solid rgba(255,90,77,.3);
  border-radius:10px;padding:11px 13px;margin-top:11px;font-size:14px}
.refs{color:var(--dim);font-size:12.5px;margin-top:12px;word-break:break-word}

.telemetry{
  font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;
  color:var(--dim);margin-top:13px;padding-top:11px;border-top:1px solid var(--edge);
}
.telemetry b{color:var(--cool);font-weight:600}
.telemetry .warn{color:var(--warm)}
footer{color:var(--dim);font-size:12px;margin-top:30px;line-height:1.5}
footer a{color:var(--dim)}
.err{color:var(--hot)}
.spin{display:inline-block;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(1turn)}}
</style>
</head>
<body>

<header>
  <h1>WHY<span>?</span></h1>
  <p class="tag">Why the f are they asking this?</p>
  <p class="rule">Paste one row from a supplier security questionnaire.
     It will not fill the form in for you. It will stop you from lying in it by
     accident.</p>
</header>

<textarea id="q" rows="3" placeholder="A data loss prevention solution is implemented."
  aria-label="One questionnaire row"></textarea>
<div class="row">
  <button class="go" id="go">Explain this</button>
</div>
<div class="examples" id="examples"></div>

<div id="out"></div>

<footer>
  Built from real supplier questionnaires.
  The agent never learns anything about your company. It does not need to.
  <br><a href="https://github.com/">Source</a>
</footer>

<script>
// The Function URL is written here by tools/deploy_web.py after a deploy, or
// pass ?api=https://... to point a local copy at a deployment.
const API = new URLSearchParams(location.search).get("api")
  || window.WHYF_API
  || "REPLACE_WITH_FUNCTION_URL";

const EXAMPLES = [
  ["Does not apply", "An inventory of cartography of industrial equipment and their associated classification is formalized and maintained up to date."],
  ["Cheap checkbox", "A data loss prevention solution is implemented."],
  ["Ask one thing", "Maximum accepted data loss for each application has been specified."],
  ["Not a control", "Have you ever sustained a material system intrusion or loss of data? If so, describe the event."]
];

const $ = s => document.querySelector(s);
const out = $("#out");
let current = null;

EXAMPLES.forEach(([label, text]) => {
  const b = document.createElement("button");
  b.textContent = label;
  b.onclick = () => { $("#q").value = text; ask(); };
  $("#examples").append(b);
});

$("#go").onclick = ask;
$("#q").addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter") ask();
});

function esc(s){ const d=document.createElement("div"); d.textContent=s??""; return d.innerHTML; }

async function post(path, payload){
  const r = await fetch(API.replace(/\/$/,"") + path, {
    method:"POST", headers:{"content-type":"application/json"},
    body: JSON.stringify(payload)
  });
  if(!r.ok){
    const e = await r.json().catch(()=>({error:"request failed"}));
    throw new Error(e.error || ("HTTP " + r.status));
  }
  return r.json();
}

async function ask(){
  const question = $("#q").value.trim();
  if(!question) return;
  if(API.startsWith("REPLACE")){
    out.innerHTML = `<div class="card err">No API URL yet. Deploy the stack,
      then reload with <code>?api=&lt;function url&gt;</code>.</div>`;
    return;
  }
  $("#go").disabled = true;
  out.innerHTML = `<div class="card"><span class="spin">/</span> thinking</div>`;
  try{
    current = await post("/", {question});
    render(current);
  }catch(err){
    out.innerHTML = `<div class="card err">${esc(err.message)}</div>`;
  }finally{ $("#go").disabled = false; }
}

async function tap(optionId){
  document.querySelectorAll(".opts button").forEach(b => b.disabled = true);
  try{
    current = await post("/answer", {
      question: current.question, concept: current.concept, option: optionId
    });
    render(current, true);
  }catch(err){
    out.insertAdjacentHTML("beforeend", `<div class="card err">${esc(err.message)}</div>`);
  }
}

function meter(value, colour){
  return `<div class="meter"><i style="width:${(value/3)*100}%;background:${colour}"></i></div>`;
}

function render(v, flipped){
  const t = v.telemetry || {};
  const isControl = v.question_class === "control";
  let h = "";

  if(!isControl){
    h += `<div class="card verdict">
      <p class="headline">Not a security question</p>
      <p class="sub">This one is ${esc(v.question_class)}, so it does not get a verdict.</p>
      <p class="concept">${esc(v.concept_title || "")}</p>
      <p class="lede">${esc(v.plain_english)}</p>
      ${v.response ? `<div class="note">${esc(v.response)}</div>` : ""}
      ${v.refer_to ? `<details open><summary>Who to actually ask</summary><p>${esc(v.refer_to)}</p></details>` : ""}
    </div>`;
  } else if(v.verdict){
    h += `<div class="card verdict v-${esc(v.verdict)}">
      <p class="headline">${esc(v.headline)}</p>
      <p class="sub">${esc(v.subtitle)}</p>
      <p class="concept">${esc(v.concept_title)}</p>
      <p class="lede">${esc(v.plain_english)}</p>
      <div class="bars">
        <b>Security</b>${meter(v.security_value,"var(--cool)")}<b>${v.security_value}/3</b>
        <b>Checkbox</b>${meter(v.checkbox_value,"var(--warm)")}<b>${v.checkbox_value}/3</b>
        ${v.checkbox_value > v.security_value
          ? `<div class="gap">Worth more as an answer than as a fix. That gap is the point.</div>` : ""}
      </div>
    </div>`;
  } else {
    h += `<div class="card verdict">
      <p class="headline">${esc(v.headline)}</p>
      <p class="sub">${esc(v.subtitle)}</p>
    </div>`;
  }

  (v.notes || []).forEach(n => h += `<div class="note">${esc(n)}</div>`);

  const dq = v.deciding_question;
  if(dq && dq.text){
    h += `<div class="card ask"><p>${esc(dq.text)}</p><div class="opts">` +
      (dq.options||[]).map(o =>
        `<button onclick="tap('${esc(o.id)}')">${esc(o.label)}</button>`
      ).join("") + `</div></div>`;
  }

  const drills = [
    ["What everyone gets wrong", v.misunderstanding],
    ["The case against doing it", v.skeptic_case],
    ["If it does not apply to you", v.how_to_say_no]
  ].filter(([,text]) => text);

  const bands = Object.entries(v.cost_bands || {});
  if(drills.length || bands.length){
    h += `<div class="card">`;
    drills.forEach(([label, text]) =>
      h += `<details><summary>${label}</summary><p>${esc(text)}</p></details>`);
    if(bands.length){
      h += `<details><summary>What it costs</summary><div class="cost">` +
        bands.map(([k,band]) => `<span>${esc(k)}</span><span>${esc(band)}</span>`).join("") +
        `</div></details>`;
    }
    if(v.maturity_ladder && v.maturity_ladder.enough_rung){
      const m = v.maturity_ladder;
      h += `<details><summary>Which rung is enough</summary>
        <p><b>Rung ${m.enough_rung} of 4.</b> ${esc(m.why_not_4 || "")}</p>` +
        (m.rungs||[]).map(r =>
          `<p style="color:${r.level===m.enough_rung?"var(--ink)":"var(--dim)"}">
            ${r.level}. ${esc(r.gist)}</p>`).join("") + `</details>`;
    }
    if(v.evidence && v.evidence.strong){
      h += `<details><summary>What proof satisfies them</summary>
        <p><b>Weak.</b> ${esc(v.evidence.weak)}</p>
        <p><b>Better.</b> ${esc(v.evidence.better)}</p>
        <p><b>Strong.</b> ${esc(v.evidence.strong)}</p></details>`;
    }
    h += `</div>`;
  }

  const refs = Object.entries(v.references || {}).filter(([,ids]) => ids.length);
  if(refs.length){
    h += `<div class="refs">` + refs.map(([kind, ids]) =>
      `${kind.replace("_"," ")}: ${ids.map(esc).join(", ")}`).join(" &nbsp;&middot;&nbsp; ")
      + `</div>`;
  }

  const bits = [
    `tier <b>${esc(t.tier||"?")}</b>`,
    `${t.model_calls||0} model call${t.model_calls===1?"":"s"}`,
    `${t.searches||0} searches`,
    `${(t.elapsed_s||0).toFixed(t.elapsed_s < 1 ? 3 : 1)} s`
  ];
  if(t.degraded) bits.push(`<span class="warn">degraded: ${esc(t.degraded_reason)}</span>`);
  h += `<div class="telemetry">${bits.join(" &nbsp;&middot;&nbsp; ")}</div>`;

  out.innerHTML = h;
  if(flipped) out.querySelector(".verdict").scrollIntoView({behavior:"smooth", block:"center"});
}
</script>
</body>
</html>
