source_note: "Okta's own incident analysis, presented by its customer trust team."

one_line: >
  Attackers got into the account of a support engineer at one of Okta's
  suppliers and briefly saw customer information through the support tool.

what_happened: >
  Okta detected an attempt against an account belonging to a third-party
  customer support engineer. The activity happened on 21 January 2022 and
  lasted about twenty-five minutes. The attacker reached the support tool and
  viewed information relating to two customers. What that account could reach
  had been deliberately limited, and that limit is the reason this is a short
  entry rather than a long one.

what_it_cost:
  figure: ""
  basis: "No incident-specific financial figure was disclosed, and none is estimated here."

the_control_that_would_have_helped: >
  Awkwardly for a horror story, the controls worked: MFA, least privilege,
  logging and detection kept a support account compromise to two customers and
  twenty-five minutes. What failed was governing third-party access and telling
  customers in time. Worth citing when somebody asks for evidence that
  least privilege earns its keep.

concepts: [third-party-access, mfa, security-monitoring, logging]
