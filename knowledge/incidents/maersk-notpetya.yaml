source_note: "A.P. Moller-Maersk 2017 Annual Report, operational risks and cyber-attack section."

one_line: >
  NotPetya destroyed most of Maersk's corporate IT, and a global shipping
  company had to rebuild thousands of computers and servers from nothing.

what_happened: >
  NotPetya got into Maersk's Windows environment and spread across the network
  at speed. It encrypted machines and left applications and computers unusable.
  Booking, logistics, terminal and administrative work stopped across the
  company. Maersk rebuilt large parts of its computing estate rather than
  decrypting it.

what_it_cost:
  figure: "approximately USD 300 million"
  basis: "Maersk's own estimate of the financial impact, reported with its 2017 results. The 2017 Annual Report describes the attack and the operational consequences."

the_control_that_would_have_helped: >
  Segmentation, and a recovery capability that does not live on the network it
  is recovering. NotPetya proves an attacker does not need to understand your
  business: a flat, uniformly trusted Windows and Active Directory estate turns
  one infected machine into a company-wide outage without any help.

concepts: [network-segmentation, offline-backups, patch-management, bcp]
