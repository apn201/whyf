one_line: >
  Attackers operated the substations themselves, opened the breakers and
  switched the power off for around 225,000 customers.

what_happened: >
  Attackers compromised Ukrainian electricity distribution companies and
  reached the SCADA operator workstations. They used the operators' own
  interfaces to open breakers at substations, and at the same time wrecked the
  operators' ability to take control back. Malware damaged computers and
  supporting infrastructure to slow the recovery. Around 225,000 customers lost
  power for one to six hours, and crews restored it by hand.

