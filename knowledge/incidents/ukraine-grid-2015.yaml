the_control_that_would_have_helped: >
  Segmentation between the office network and the control network, hardened
  remote access, and the ability to run and recover manually. The lesson people
  miss: there was a firewall on the IT/OT boundary. A boundary that legitimate
  remote paths still cross is a boundary the attacker uses too.

concepts: [network-segmentation, remote-access, plc-access, ics-emergency-modes]
