id: norsk-hydro
name: Norsk Hydro / LockerGoga
year: 2019
sector: manufacturing
ot: false                    # did it hit operational technology / a physical process

status: done                # every figure below is sourced

# VERIFY EVERY NUMBER. This is the field that kills the submission if it is
# wrong. If you cannot find a figure you would defend in a boardroom, delete
# the field rather than estimating. The agent may only cite what is here.
source_url: "https://www.hydro.com/globalassets/download-center/investor-downloads/ar19/annual-report-2019-web.pdf"   # primary source. Company filing or regulator beats press.
source_note: "Norsk Hydro 2019 Annual Report, Board of Directors' Report."

one_line: >
  Ransomware took out Hydro's IT systems, and parts of an aluminium business
  went back to running on paper at reduced output.

what_happened: >
  Norsk Hydro was hit on 19 March 2019. IT systems were disrupted across the
  group, with Extruded Solutions worst affected. Production and order
  processing suffered, and parts of the business ran manually until systems
  came back. Nobody manipulated the metal: the attacker never touched the
  physical process, and the production loss came from losing the IT wrapped
  around it.

what_it_cost:
  figure: "NOK 650-750 million"
  basis: "Norsk Hydro 2019 Annual Report. NOK 216 million of insurance compensation was recognised in 2019."

the_control_that_would_have_helped: >
  Segmentation, and production systems able to keep running when corporate IT
  is gone. Use this one as the counterexample whenever somebody calls a factory
  outage an OT attack: output fell without a single command being sent to a
  machine.

concepts: [network-segmentation, offline-backups, bcp, ics-emergency-modes]
