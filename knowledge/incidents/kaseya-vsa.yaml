source_note: "Kaseya's incident overview and technical details, corroborated by the DOJ indictment."

one_line: >
  Attackers broke the software that IT providers use to manage their customers'
  computers, then used that trusted software to push ransomware onto the
  customers.

what_happened: >
  Attackers exploited zero-day flaws in Kaseya VSA to bypass authentication and
  run commands. VSA is a remote management platform, so owning it gave them a
  supported, trusted and entirely normal-looking route onto every endpoint it
  managed. The ransomware landed on the downstream customers of managed service
  providers, most of whom had never heard of Kaseya. It is the textbook case of
  a compromised management plane.

what_it_cost:
  figure: "USD 70 million, demanded not paid"
  basis: "Ransom demand recorded in the congressional investigation. Kaseya did not pay it, and no total loss figure for the affected customers is cited here."

the_control_that_would_have_helped: >
  Secure development and fast patching, at the vendor. For everyone else the
  lesson is blast radius: a tool that can run commands on all of your machines
  deserves exactly as much trust as its worst day, and almost nobody asks what
  happens when that tool is the attacker.

concepts: [secure-development, vulnerability-management, privileged-accounts, third-party-risk]
