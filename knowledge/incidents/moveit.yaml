source_note: "Progress Software's security advisory and customer FAQ. Progress's SEC annual-report disclosures cover the legal and remediation consequences."

one_line: >
  A flaw in a widely used file-transfer product let attackers take data out of
  every exposed installation of it they could reach.

what_happened: >
  Attackers exploited a previously unknown vulnerability in MOVEit Transfer, a
  file-transfer application organisations run themselves. The flaw gave
  unauthorised access to the data sitting in those customer-controlled
  installations. The Clop group exploited it at scale against as many
  organisations as it could find. There was no ransomware and no outage: this
  was theft, and most victims learned about it afterwards.

what_it_cost:
  figure: ""
  basis: "Deliberately blank. The cost landed on hundreds of separate victims in wildly different amounts, and no credible single figure exists for the incident as a whole."

the_control_that_would_have_helped: >
  Knowing you had one, and patching it. Once the flaw was public the useful
  work was unglamorous: find every exposed MOVEit instance, apply the vendor
  fix, and ask why a file-transfer server was reachable from the internet at
  all.

concepts: [patch-management, vulnerability-management, asset-inventory, third-party-risk]
