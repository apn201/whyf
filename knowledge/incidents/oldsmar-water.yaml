source_url: "https://www.pinellassheriff.gov/21-015-detectives-investigate-computer-software-intrusion-at-oldsmar-s-water-treatment-plant"   # primary source. Company filing or regulator beats press.
source_note: "Pinellas County Sheriff's Office incident report, 8 February 2021."

one_line: >
  Somebody reached the water plant's control computer from outside and tried to
  change how much chemical went into the drinking water.

what_happened: >
  An unauthorised user got remote access to a computer at the Oldsmar water
  treatment plant. They opened the function controlling sodium hydroxide and
  moved the setpoint from around 100 ppm to 11,100 ppm. An operator watching
  the screen saw the value change and put it straight back. This one crossed
  the line: a keyboard somewhere altered a physical treatment process.

what_it_cost:
  figure: ""
  basis: "No meaningful financial loss was established publicly. The change was caught before it reached anybody's tap."

the_control_that_would_have_helped: >
  Not having internet-reachable remote administration on a plant computer, or
  wrapping it in MFA and monitoring if it must exist. The EPA names
  internet-facing remote access as the recurring weakness in this class of
  incident, and it is the whole story here.

concepts: [remote-access, plc-access, mfa, security-monitoring]
