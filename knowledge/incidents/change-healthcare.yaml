source_url: ""              # url not captured yet; the citation is in source_note
source_note: "UnitedHealth Group 2024 Form 10-K, p. 24. See also the Form 8-K filed February 2024."

one_line: >
  Ransomware inside Change Healthcare's IT systems stopped the machinery that
  moves claims and payments between providers, insurers and pharmacies.

what_happened: >
  Attackers reached Change Healthcare's IT environment on 21 February 2024.
  UnitedHealth isolated the affected systems, and that isolation is what
  stopped claims processing, payments and a long list of other services.
  Nothing medical was touched - no device, no treatment process, nothing
  physical. Recovery meant rebuilding and restoring systems while lending money
  to the providers who could no longer get paid.

what_it_cost:
  figure: "USD 2.2 billion"
  basis: "UnitedHealth Group 2024 Form 10-K: direct response costs recognised in 2024. The same filing puts a further USD 867 million on estimated business disruption."

the_control_that_would_have_helped: >
  Privileged access control and segmentation. What mattered was the distance
  between one compromised account and the transaction infrastructure of an
  entire industry, and there was not enough of it. This is an identity and
  containment story, not a healthcare one.

concepts: [privileged-accounts, mfa, network-segmentation, incident-response]
