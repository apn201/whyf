source_url: ""              # url not captured yet; the citation is in source_note
source_note: "SolarWinds Form 8-K of 17 December 2020. The CISA advisory is the authoritative technical corroboration."

one_line: >
  Attackers hid malicious code inside SolarWinds' own software, so customers
  installing a legitimate update installed the attacker with it.

what_happened: >
  Attackers compromised the environment where SolarWinds builds its software
  and inserted the SUNBURST backdoor into Orion builds. The poisoned builds
  went out through the normal update mechanism, signed and expected. Selected
  customers were then followed up individually after installing what looked
  like an ordinary patch. The campaign was espionage: nothing was encrypted and
  nothing stopped working.

what_it_cost:
  figure: ""
  basis: "SolarWinds disclosed significant investigation, remediation and legal consequences, but no single incident cost with a defined accounting basis. None is invented here."

the_control_that_would_have_helped: >
  Treating the build pipeline as production. Hardened build infrastructure,
  privileged access control around it, separated build environments and some
  independent check that the artifact shipped is the artifact written. Note
  what does not help: patching faster would have made this worse.

concepts: [secure-development, secure-procurement, privileged-accounts, third-party-risk]
