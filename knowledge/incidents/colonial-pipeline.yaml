source_url: ""              # url not captured yet; the citation is in source_note
source_note: "GAO-21-105263 on TSA's pipeline security programme, plus the CEO's congressional testimony."

one_line: >
  Ransomware encrypted Colonial's office IT, and the company shut the physical
  pipeline itself because it could no longer run the business around it.

what_happened: >
  DarkSide ransomware compromised Colonial's business IT environment. It did
  not reach the systems that control the pipeline. Colonial disconnected the
  systems that monitor and control the physical pipeline anyway, to stop the
  infection spreading, and fuel distribution stopped for several days. The
  physical process halted because of a business dependency and a containment
  decision, not because anybody operated the pipeline.

what_it_cost:
  figure: "USD 4.4 million"
  basis: "Ransom paid, stated by Colonial's CEO in congressional testimony. The total economic loss is far harder to establish and is deliberately not cited here."

the_control_that_would_have_helped: >
  MFA on remote access, and retiring the legacy VPN account nobody had killed.
  But the control that decided how bad this got was the separation between
  business IT and the pipeline, which is exactly why the attackers never
  touched the pipeline. Read that twice: OT impact is not OT compromise, and
  most retellings of this incident get it wrong.

concepts: [mfa, remote-access, identity-lifecycle, network-segmentation]
