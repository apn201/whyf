source_url: ""              # url not captured yet; the citation is in source_note
source_note: "Target FY2013 Form 10-K; the clearer cost figures are in Target's subsequent quarterly results."

one_line: >
  Attackers took the credentials of a heating and ventilation contractor, used
  them to get into Target's network, and left with payment card data.

what_happened: >
  Attackers compromised a third-party HVAC contractor that held legitimate
  access to Target's environment. They used those credentials to get in, and
  from there reached the systems handling payment cards. Malware on the tills
  collected card data as it was swiped. It became the landmark case of vendor
  access turning into a headline breach.

what_it_cost:
  figure: "USD 162 million net through FY2014"
  basis: "Target's FY2014 results: USD 145 million of net breach-related expense in FY2014, plus USD 17 million in FY2013."

the_control_that_would_have_helped: >
  Third-party access control and segmentation. The failure was never
  air-conditioning cybersecurity, whatever the retelling says. It was that a
  path existed from a low-trust supplier's login to the systems handling card
  data, and nobody had ever walked it.

concepts: [third-party-access, network-segmentation, third-party-risk, supplier-inventory]
