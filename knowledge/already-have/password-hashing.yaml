id: password-hashing
title: Passwords are stored hashed
status: done

# What is already true for anyone on a normal business subscription.
claim: >
  If your accounts live in Microsoft Entra ID or Google Workspace, passwords
  are stored as one-way hashes and neither you nor the provider's support
  staff can read them back. You did not configure this and you cannot turn
  it off.

microsoft365:
  applies_to: "All tiers using Entra ID accounts"
  where_to_look: "No setting to show. Cite the platform."
  evidence: "The platform's published security documentation, plus the fact that password reset issues a new password rather than showing the old one."

google_workspace:
  applies_to: "All editions using Google accounts"
  where_to_look: "No setting to show. Cite the platform."
  evidence: "The same: reset issues a new password, it never reveals one."

# When the claim is NOT true. There is always a case, and leaving it
# out is how this becomes a liability generator.
caveat: >
  Only true for accounts held in the platform. If you also run a
  line-of-business application with its own user table, that is a separate
  answer and it may well be storing passwords badly. The question usually
  means all systems, so check the old ones before answering yes for
  everything.

concepts: [passwords, password-policy]
