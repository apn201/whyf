id: passwords
title: Password storage
status: done
class: control
csf: PR
priority: 2

# What the question is actually asking, for someone who has never heard
# the term and runs the company themselves.
plain_english: >
  Is there a safe place for the system and infrastructure passwords. The
  ones that are not tied to a person.

# The thing everyone gets wrong.
misunderstanding: >
  Nothing fancy here. If they are on paper in a fireproof safe, that might
  be good enough. Have a process, write it down, and you are probably fine.
  The failure is not the storage method. It is that the passwords live in
  one person's head or in a spreadsheet on their desktop, and that person is
  on holiday when the server dies.

# The honest argument for not doing it. The Skeptic agent gets this verbatim.
skeptic_case: >
  A password manager is cheap and worth it, but the honest small-company
  answer of a sealed envelope in a safe with a signed-out log is a real
  control and passes an audit. What does not pass is a spreadsheet called
  passwords.xlsx on a shared drive, and that is what most companies actually
  have.

# Facts about the company that make the question relevant, and the ones
# that make it a clean 'not applicable'.
applies_if: [has_servers, has_network]
applies_never_if: []

# Wording for the comment box when it does not apply. States scope. Never
# asserts a fact about the company.
how_to_say_no: >
  Applicable. Shared and system credentials are held in a controlled store
  with recorded access. The mechanism is described below.

default_verdict: write-it-down

# The one fact that moves the verdict. Buttons, no typing.
deciding_question:
  text: "Where is the admin password for your main server right now?"
  options:
    - id: head
      label: "In somebody's head"
      verdict: do-it-properly
      why: >
        That is a continuity problem before it is a security one. Get it written
        down and stored properly, because the day you need it is the day that
        person is unreachable.
    - id: sheet
      label: "In a spreadsheet somewhere"
      verdict: do-it-properly
      why: >
        Move it. A password manager costs a few euros a month, or a sealed
        envelope in the safe costs nothing. Either beats a file anyone with the
        share can open.
    - id: vault
      label: "In a password manager or a safe"
      verdict: already-solved
      why: >
        Answer with which, and whether access is logged. That is the whole
        control.

# The corpus never asks this as a ladder.
maturity_ladder: null

# What it costs, by how far you take it.
cost_bands:
  "sealed envelope in a safe": "€"
  "team password manager": "€€"
  "privileged access management platform": "€€€€"

# 0-3 each. The gap between them is the whole point.
security_value: 2
checkbox_value: 2

# What an auditor actually accepts.
evidence:
  weak: "Somebody knows where the passwords are."
  better: "A named store, with who has access to it."
  strong: "The store, the access list, and a record of check-out for shared credentials."

answer_risk: none

frameworks: [nist-csf-pr.aa-01, iso27002-5.17]
