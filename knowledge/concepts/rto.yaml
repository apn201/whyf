# 0-3 each. The gap between them is the whole point.
security_value: 2
checkbox_value: 3

# What an auditor actually accepts.
evidence:
  weak: "We would get back up quickly."
  better: "A stated recovery time objective per critical system."
  strong: "The objectives, plus a dated test showing what recovery actually took against them."

answer_risk: none

