id: password-policy
title: Password policy
status: done
class: control
csf: PR
priority: 2

# What the question is actually asking, for someone who has never heard
# the term and runs the company themselves.
plain_english: >
  Do you have a rule stopping people choosing stupid passwords.

# The thing everyone gets wrong.
misunderstanding: >
  In Windows you usually have this already, but best practice has moved and
  standard Windows does not always support where it moved to. The
  eight-character complex password is not recommended any more. It makes
  life difficult for your users while attackers phish instead and never
  touch the password rules. Passphrases are getting common. When a password
  is long enough, sixteen characters and up, you do not need to expire it
  and you do not need complexity rules. It is just maths.

# The honest argument for not doing it. The Skeptic agent gets this verbatim.
skeptic_case: >
  Forced ninety-day rotation is the clearest example on this whole form of a
  control that makes things worse. People respond with Summer2025! then
  Autumn2025!, and you have spent goodwill to get a predictable password. If
  a questionnaire insists on an expiry interval, answer what you actually do
  and say why. Nobody has ever lost a deal over it.

# Facts about the company that make the question relevant, and the ones
# that make it a clean 'not applicable'.
applies_if: [has_employees]
applies_never_if: []

# Wording for the comment box when it does not apply. States scope. Never
# asserts a fact about the company.
how_to_say_no: >
  Applicable. Password rules are enforced centrally. We use a minimum length
  with breached-password screening rather than short passwords with forced
  rotation, and the basis for that is stated below.

default_verdict: already-solved

# The one fact that moves the verdict. Buttons, no typing.
deciding_question:
  text: "Do you still force everyone to change passwords every 90 days?"
  options:
    - id: yes
      label: "Yes"
      verdict: write-it-down
      why: >
        Turn it off and raise the minimum length instead. It is a settings change,
        it costs nothing, and your users will like you more. Write down why,
        because somebody will ask.
    - id: no
      label: "No, we use long passwords"
      verdict: already-solved
      why: >
        That is current best practice. Say so, cite the length, and be ready to
        explain it to an auditor working from a 2010 checklist.

# Which rung is enough, and what the top one actually costs. This is a
# judgement per concept and per sector, not a number off a table.
maturity_ladder:
  enough_rung: 3
  why_not_4: >
    Rung 4 asks for the same configuration standard across every system
    including databases and network kit. Getting the last legacy appliance in
    line is usually a rebuild, and those systems are better handled by not
    exposing them at all.
  rungs:
    - level: 1
      gist: "No rules, anything goes."
      verdict: do-it-properly
    - level: 2
      gist: "Rules on the main directory only."
      verdict: cheap-checkbox
    - level: 3
      gist: "Consistent rules across the systems people log in to."
      verdict: already-solved
    - level: 4
      gist: "Every system including legacy and network kit."
      verdict: cheap-checkbox

# What it costs, by how far you take it.
cost_bands:
  "change the settings you already have": "€"
  "breached-password screening add-on": "€€"
  "bringing legacy systems into line": "€€€"

# 0-3 each. The gap between them is the whole point.
security_value: 1
checkbox_value: 2

# What an auditor actually accepts.
evidence:
  weak: "There is a password policy somewhere."
  better: "A screenshot of the enforced settings from the directory."
  strong: "The settings, the systems they cover, and the list of systems they do not."

answer_risk: none

frameworks: [nist-csf-pr.aa-01, iso27002-5.17]
incidents: []
patterns: [documentation-only]
already_have: [password-hashing]
