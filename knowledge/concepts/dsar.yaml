# 0-3 each. The gap between them is the whole point.
security_value: 0
checkbox_value: 2

# What an auditor actually accepts.
evidence:
  weak: "We would help if asked."
  better: "A written process covering which systems are searched and within what timeframe."
  strong: "The process, plus a record of a completed or rehearsed request and how long it took."

answer_risk: none

