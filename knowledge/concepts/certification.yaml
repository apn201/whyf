id: certification
title: Security certification
status: done
class: attestation
csf: ID
priority: 2

# Not a security control, so it never gets one of the six verdicts.

plain_english: >
  Do you hold a certificate. ISO 27001, SOC 2, Cyber Essentials, that
  family.

# What the tool says back.
response: >
  Sometimes a certificate is required by law, by regulation, or by a
  customer who will not sign without it. When it is not required, fixing
  your processes is worth more than certifying them. A certificate is not
  proof that you are secure. It is proof that somebody looked at your
  process on one day and it matched what you said it was. It is expensive
  and it eats the same people who would otherwise be fixing things, so
  getting certified is not a goal on its own. What it does buy you is a
  shortcut: one line on the form can close a whole section of questions, and
  that is a real commercial saving if you are getting these questionnaires
  every month. Count how many you got last year before you decide.

answer_risk: certification

# Who to actually talk to, if anyone.
refer_to: >
  Whoever owns the biggest customer relationship. They know whether a
  certificate is actually being asked for or whether somebody just put it on
  a wish list.

