id: antivirus-exclusions
title: Anti-virus exclusions for vendor software
status: done
class: control
csf: PR
priority: 2

# What the question is actually asking, for someone who has never heard
# the term and runs the company themselves.
plain_english: >
  Do you have a process for systems where antivirus cannot be installed.
  Usually production and OT systems.

# The thing everyone gets wrong.
misunderstanding: >
  Air-gapped is usually not good enough. Every system eventually gets
  connected to external media or a network, so some protection is needed.
  Where it genuinely cannot be installed, the exception has to be approved
  and the system hardened instead. The version of this question that catches
  people out is the negative phrasing. It is worded so that agreeing means
  the opposite of what it looks like. Read it twice before ticking.

# The honest argument for not doing it. The Skeptic agent gets this verbatim.
skeptic_case: >
  There is no version of this you get to skip, but there is a version that
  takes one line. If endpoint protection is running everywhere and nobody
  has turned it off, say exactly that and you are done. What you cannot do
  is answer yes while a machine in the corner has it disabled, because that
  is the machine the question is about. Anywhere it is off, or anywhere a
  vendor has made you exclude a folder or a process so their software will
  run, that is an exception: it needs a name, a reason, somebody who
  approved it, and something else protecting the box instead. That list is
  usually short and almost never written down, which is why the question
  gets asked.

# Facts about the company that make the question relevant, and the ones
# that make it a clean 'not applicable'.
applies_if: [has_ot, has_servers]
applies_never_if: [all_systems_protected]

# Wording for the comment box when it does not apply. States scope. Never
# asserts a fact about the company.
how_to_say_no: >
  Not applicable. All systems in scope run endpoint protection with no
  vendor-required exclusions.

default_verdict: need-one-fact

# The one fact that moves the verdict. Buttons, no typing.
deciding_question:
  text: "Is there anywhere endpoint protection is off, or scanning something less than everything?"
  options:
    - id: none
      label: "No, it is on everywhere and untouched"
      verdict: not-applicable
      why: >
        Then say that in one line. It is the right answer for most companies
        getting this question, and it is the only version of this row that costs
        you nothing.
    - id: excluded
      label: "It runs, but some folders are excluded"
      verdict: write-it-down
      why: >
        Those exclusions came from somewhere, usually a vendor telling you their
        software breaks otherwise. List which paths, whose software required it,
        and who agreed. An unexplained exclusion is the thing that survives on a
        machine for six years.
    - id: some
      label: "A few machines cannot run it"
      verdict: write-it-down
      why: >
        Then write down which ones, why, who approved it, and what protects them
        instead. Usually network isolation and locked-down access. That is a
        complete answer.

# The corpus never asks this as a ladder.
maturity_ladder: null

# What it costs, by how far you take it.
cost_bands:
  "document the exceptions": "€"
  "isolate and harden the excepted systems": "€€€"

# 0-3 each. The gap between them is the whole point.
security_value: 2
checkbox_value: 2

# What an auditor actually accepts.
evidence:
  weak: "Everything has antivirus."
  better: "A list of systems without endpoint protection, and of the exclusions configured on the ones that have it, with reasons."
  strong: "The list, the approval for each exception, and a description of the compensating controls."

answer_risk: none


# Words a questionnaire uses for this that the card above does not. This
