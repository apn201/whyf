id: credential-monitoring
title: Leaked credential monitoring
status: done
class: control
csf: DE
priority: 3

# What the question is actually asking, for someone who has never heard
# the term and runs the company themselves.
plain_english: >
  Do you watch for your staff's email addresses and passwords turning up in
  other people's data breaches.

# The thing everyone gets wrong.
misunderstanding: >
  The dark web framing makes this sound exotic and it is not. Somebody used
  their work email on a shopping site, that site got breached, and now a
  password they may also have used at work is in a list. The useful control
  is not watching a marketplace, it is making the exposure not matter: a
  leaked password is harmless against an account with a second factor.

# The honest argument for not doing it. The Skeptic agent gets this verbatim.
skeptic_case: >
  Dark web monitoring is sold on fear and it mostly produces a monthly
  report of old breaches you can do nothing about. Before buying any of it:
  turn on MFA, and turn on breached-password screening in your identity
  platform, which blocks known-leaked passwords at the point somebody tries
  to set one. That is the control the monitoring service would eventually
  tell you to implement, and you can have it now.

# Facts about the company that make the question relevant, and the ones
# that make it a clean 'not applicable'.
applies_if: [has_employees]
applies_never_if: []

# Wording for the comment box when it does not apply. States scope. Never
# asserts a fact about the company.
how_to_say_no: >
  Partially applicable. We do not subscribe to a credential monitoring
  service. Exposure of leaked credentials is mitigated by enforced
  multi-factor authentication and breached-password screening, described
  below.

default_verdict: cheap-checkbox

# The one fact that moves the verdict. Buttons, no typing.
deciding_question:
  text: "If a staff password leaked tomorrow, would it get anybody in?"
  options:
    - id: no
      label: "No, MFA everywhere that matters"
      verdict: already-solved
      why: >
        Then a monitoring subscription buys you very little. Say what you have
        instead, which is a stronger answer than the service would be.
    - id: maybe
      label: "Possibly"
      verdict: do-it-properly
      why: >
        Fix that first. MFA and breached-password screening cost nothing on your
        existing licence and they make the leak irrelevant, which monitoring never
        does.

# Which rung is enough, and what the top one actually costs. This is a
# judgement per concept and per sector, not a number off a table.
maturity_ladder:
  enough_rung: 1
  why_not_4: >
    Every rung above the first is a subscription that tells you about an
    exposure you should already have made harmless. The control that changes
    outcomes is the second factor, not the alert.
  rungs:
    - level: 1
      gist: "MFA and breached-password screening in place."
      verdict: already-solved
    - level: 2
      gist: "Occasional checks against public breach data."
      verdict: cheap-checkbox
    - level: 3
      gist: "Monitoring service with alerting."
      verdict: cheap-checkbox
    - level: 4
      gist: "Continuous monitoring with automated response."
      verdict: cheap-checkbox

# What it costs, by how far you take it.
cost_bands:
  "MFA and breached-password screening": "€"
  "free public breach lookup": "€"
  "credential monitoring subscription": "€€€"

# 0-3 each. The gap between them is the whole point.
security_value: 1
checkbox_value: 2

# What an auditor actually accepts.
evidence:
  weak: "We have not seen anything."
  better: "A statement of what mitigates leaked credentials, naming MFA coverage."
  strong: "The MFA coverage report, the breached-password setting, and any monitoring source used."

answer_risk: none


