# 0-3 each. The gap between them is the whole point.
security_value: 2
checkbox_value: 2

# What an auditor actually accepts.
evidence:
  weak: "We would investigate."
  better: "The incident process requiring preservation before rebuild."
  strong: "The process, plus where images and logs are kept and for how long."

answer_risk: none

