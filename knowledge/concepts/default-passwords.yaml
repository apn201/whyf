id: default-passwords
title: Default passwords
status: done
class: control
csf: PR
priority: 2

# What the question is actually asking, for someone who has never heard
# the term and runs the company themselves.
plain_english: >
  Do you have a process making sure no password is ever left as it came out
  of the box, and that the ones you hand to new users are not guessable
  either.

# The thing everyone gets wrong.
misunderstanding: >
  Many think this only covers infrastructure, so they change the firewall
  password and then create every new user with Welcome2026. Both ends count.
  The router in the corner and the temporary password in the welcome email
  are the same weakness.

# The honest argument for not doing it. The Skeptic agent gets this verbatim.
skeptic_case: >
  There is nothing to buy and no reason to skip it. The only cost is
  remembering, which is why it belongs in the setup checklist for new kit
  and the onboarding script for new people rather than in a policy nobody
  reads.

# Facts about the company that make the question relevant, and the ones
# that make it a clean 'not applicable'.
applies_if: [has_network]
applies_never_if: []

# Wording for the comment box when it does not apply. States scope. Never
# asserts a fact about the company.
how_to_say_no: >
  Applicable. Default credentials are changed at commissioning, and initial
  user credentials are unique and must be changed at first use.

default_verdict: write-it-down

# The one fact that moves the verdict. Buttons, no typing.
deciding_question:
  text: "If I opened your new-user script, what password would it set?"
  options:
    - id: pattern
      label: "The same one every time"
      verdict: do-it-properly
      why: >
        Change it to a random one per user that must be changed at first login. It
        is a one-line change and it removes a genuinely easy way in.
    - id: random
      label: "A random one, changed at first login"
      verdict: already-solved
      why: >
        Good. Now check the same discipline reaches the network kit and any
        machine on the factory floor.

# The corpus never asks this as a ladder.
maturity_ladder: null

# What it costs, by how far you take it.
cost_bands:
  "fix the onboarding script": "€"
  "commissioning checklist for new kit": "€"
  "credential vault for shared devices": "€€"

# 0-3 each. The gap between them is the whole point.
security_value: 2
checkbox_value: 2

# What an auditor actually accepts.
evidence:
  weak: "We change default passwords."
  better: "A commissioning checklist including credential change."
  strong: "The checklist, plus a sample of devices showing it was done, plus the onboarding script."

answer_risk: none

frameworks: [nist-csf-pr.aa-01, nist-csf-pr.ps-01]
incidents: []
patterns: []
already_have: []
